
name: Build ZipPinch Remote

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -q ZipPinchRemote-GitHub-Project.zip -d source

      - name: Fix Info.plist generation
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project.yml")
          s = p.read_text()
          old = "        PRODUCT_BUNDLE_IDENTIFIER: com.nico.zippinchremote\n"
          new = old + "        GENERATE_INFOPLIST_FILE: YES\n"
          if "GENERATE_INFOPLIST_FILE: YES" not in s:
              assert old in s, "No se encontró la configuración esperada"
              p.write_text(s.replace(old, new, 1))
          PY
        
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: source
        run: xcodegen generate

      - name: Build iOS app
        working-directory: source
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project ZipPinchRemote.xcodeproj \
            -scheme ZipPinchRemote \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "========== ERRORES DE COMPILACION =========="

          grep -n -B 4 -A 6 "error:" build.log || true

          echo ""
          echo "========== FIN DEL REGISTRO =========="

          exit "$BUILD_STATUS"

      - name: Package IPA
        if: success()
        working-directory: source
        run: |
          set -e
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ZipPinchRemote.app Payload/
          zip -qry ZipPinchRemote.ipa Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZipPinchRemote-IPA
          path: source/ZipPinchRemote.ipa
          if-no-files-found: error
          retention-days: 7
